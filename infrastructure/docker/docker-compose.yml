version: '3.8'

# ====================================================================
# PkgSentinel — Infrastructure Subfolder Docker Compose
# NOTE: The canonical root compose file is /docker-compose.yml.
# This file is maintained for modular/infra deployments with context ../..
# ====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: pkgsentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pkgsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-pkgsentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pkgsentinel-net

  redis:
    image: redis:7-alpine
    container_name: pkgsentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pkgsentinel-net

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: pkgsentinel-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pkgsentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_secret_change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BACKEND_PORT: 8080
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-sentinel-internal-secure-token-2026}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pkgsentinel-net

  security-engine:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.security-engine
    container_name: pkgsentinel-security-engine
    restart: unless-stopped
    environment:
      SECURITY_ENGINE_REDIS_HOST: redis
      SECURITY_ENGINE_REDIS_PORT: 6379
      SECURITY_ENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SECURITY_ENGINE_BACKEND_CALLBACK_URL: http://backend:8080/internal/v1/scans
      SECURITY_ENGINE_INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-sentinel-internal-secure-token-2026}
      SECURITY_ENGINE_EPHEMERAL_WORKSPACE_DIR: ${SECURITY_ENGINE_EPHEMERAL_WORKSPACE_DIR:-/tmp/pkgsentinel/workspaces}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pkgsentinel-net

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.security-engine
    container_name: pkgsentinel-worker
    restart: unless-stopped
    command: ["python", "-m", "engine.core.queue_consumer"]
    environment:
      SECURITY_ENGINE_REDIS_HOST: redis
      SECURITY_ENGINE_REDIS_PORT: 6379
      SECURITY_ENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SECURITY_ENGINE_BACKEND_CALLBACK_URL: http://backend:8080/internal/v1/scans
      SECURITY_ENGINE_INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-sentinel-internal-secure-token-2026}
      SECURITY_ENGINE_EPHEMERAL_WORKSPACE_DIR: ${SECURITY_ENGINE_EPHEMERAL_WORKSPACE_DIR:-/tmp/pkgsentinel/workspaces}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - pkgsentinel-net

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: pkgsentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pkgsentinel-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pkgsentinel-net:
    driver: bridge
