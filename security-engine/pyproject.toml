[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgsentinel-security-engine"
version = "0.1.0"
description = "Zero-Day Malicious Package Detection Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PkgSentinel Security Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "esprima>=4.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
